# Render Blueprint for the FastAPI backend (https://render.com/docs/blueprint-spec).
# Secrets (DATABASE_URL) and environment-specific values (CORS_ORIGINS) are NOT stored
# here: `sync: false` makes Render ask for them in the dashboard when the Blueprint is applied.
services:
  - type: web
    name: smart-roster-api
    runtime: python
    plan: free
    region: singapore            # keep close to the Neon database region (aws-ap-southeast-1)
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Every start: apply migrations (idempotent), seed only an EMPTY database, then serve.
    startCommand: >-
      alembic upgrade head &&
      python -m app.cli seed --if-empty &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATABASE_URL          # Neon *direct* (non-pooler) connection string, sslmode=require
        sync: false
      - key: CORS_ORIGINS          # e.g. https://smart-roster.vercel.app (comma-separated, no trailing slash)
        sync: false
      - key: SOLVER_DETERMINISTIC_TIME
        value: "30"
      - key: SOLVER_WALL_TIME_LIMIT   # free instances have a fraction of a CPU; allow headroom
        value: "300"
      - key: COMP_OFF_EXPIRY_DAYS
        value: "60"
